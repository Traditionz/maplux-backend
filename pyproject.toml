[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = [
    "main",
    "config",
    "database",
    "domain",
    "enums",
    "exception",
    "routers",
    "security",
    "utils",
]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101",  # asserts in tests
    "S105",  # hardcoded passwords in tests/examples
    "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S107", "B017"]
"routers/**/*.py" = ["B008"]
"security/authentication.py" = ["B008"]
